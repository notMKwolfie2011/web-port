<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | People Playground</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; width: 100%; background: #000; }
        #unity-container { width: 100%; height: 100%; position: fixed; top: 0; left: 0; }
    </style>
</head>
<body>
    <div id="loading-text" style="color: white; font-size: 32px; font-family: sans-serif; text-align: center; margin-top: 20%; font-weight: bold;">PREPARING UNITY FILES...</div>
    <div id="unity-container" class="unity-desktop" hidden>
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
        </div>
    </div>
    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");

        function mergeFiles(fileParts) {
            return new Promise((resolve, reject) => {
                let buffers = [];
                function fetchPart(index) {
                    if (index >= fileParts.length) {
                        let mergedBlob = new Blob(buffers, { type: 'application/octet-stream' });
                        resolve(URL.createObjectURL(mergedBlob));
                        return;
                    }
                    // Fetches directly from your local Vercel directories, dodging jsDelivr blocks
                    fetch("./" + fileParts[index]).then(res => res.arrayBuffer()).then(data => {
                        buffers.push(data);
                        fetchPart(index + 1);
                    }).catch(reject);
                }
                fetchPart(0);
            });
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) { parts.push(file + ".part" + i); }
            return parts;
        }

        Promise.all([
            mergeFiles(getParts("Build/PPG.wasm", 1, 3)),
            mergeFiles(getParts("Build/PPG.data", 1, 6))
        ]).then(([wasmUrl, dataUrl]) => {
            container.hidden = false;
            var config = {
                dataUrl: dataUrl,
                frameworkUrl: "./Build/PPG.framework.js",
                codeUrl: wasmUrl,
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Studio Minus",
                productName: "People Playground",
                productVersion: "0"
            };
            
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            loadingBar.style.display = "block";
            var script = document.createElement("script");
            script.src = "./Build/PPG.loader.js";
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    progressBarFull.style.width = 100 * progress + "%";
                }).then((instance) => {
                    loadingBar.style.display = "none";
                    if(document.querySelector("#loading-text")) document.querySelector("#loading-text").remove();
                }).catch(alert);
            };
            document.body.appendChild(script);
        }).catch(err => {
            document.querySelector("#loading-text").innerText = "BOOT ERROR: Files mismatched or missing in deployment directory.";
        });
    </script>
</body>
</html>
